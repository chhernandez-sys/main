name: Cherry Pick from PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to cherry-pick"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Get commits from PR
        id: pr_commits
        run: |
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          gh pr view ${{ github.event.inputs.pr_number }} \
            --json commits \
            --jq '.commits[].oid' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create branch from new_main
        run: |
          git fetch origin
          git checkout -B new_main origin/new_main
          git checkout -b cherry-pick-${{ github.run_id }}

      - name: Cherry-pick commits
        run: |
          while read commit
          do
            echo "Cherry-picking $commit"
            git cherry-pick $commit || true
          done <<< "${{ steps.pr_commits.outputs.commits }}"

          git add .
          git commit --no-edit || true

      - name: Push branch
        run: |
          git push origin HEAD

      - name: Create PR
        run: |
          gh pr create \
            --base new_main \
            --head cherry-pick-${{ github.run_id }} \
            --title "Cherry-pick PR #${{ github.event.inputs.pr_number }}" \
            --body "Automated cherry-pick from PR #${{ github.event.inputs.pr_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}