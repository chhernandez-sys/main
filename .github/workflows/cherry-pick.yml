name: Cherry Pick Hybrid

on:
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to cherry-pick"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    # Run automatically when a PR is merged and has the 'cherry-pick' label
    # Or run manually using workflow_dispatch
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'cherry-pick'))
      ||
      (github.event_name == 'workflow_dispatch')

    steps:
      # Checkout full repository history to allow cherry-pick operations
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Git identity for commits created by the workflow
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # Determine execution mode:
      # - Manual run: use a specific commit SHA provided as input
      # - PR run: use the merge commit generated by GitHub
      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=commit" >> $GITHUB_OUTPUT
            echo "value=${{ github.event.inputs.commit }}" >> $GITHUB_OUTPUT
          else
            echo "mode=merge_commit" >> $GITHUB_OUTPUT
            echo "value=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_OUTPUT
          fi

      # Always start from the latest state of new_main
      # Then create a new branch where the cherry-pick will be applied
      - name: Create branch from new_main
        run: |
          git fetch origin
          git checkout -B new_main origin/new_main
          git checkout -b cherry-pick-${{ github.run_id }}

      # Apply the cherry-pick:
      # - Single commit when run manually
      # - Merge result when triggered from a PR
      # Always finalize the operation, even if conflicts occur
      - name: Cherry-pick
        run: |
          if [ "${{ steps.vars.outputs.mode }}" = "commit" ]; then
            echo "Cherry-picking single commit"
            git cherry-pick ${{ steps.vars.outputs.value }} || true
          else
            echo "Cherry-picking merge commit"
            git cherry-pick -m 1 ${{ steps.vars.outputs.value }} || true
          fi

          # Finalize cherry-pick to ensure a commit is created
          # This allows PR creation even when there are conflicts
          git add .
          git commit --no-edit || true

      # Push the new branch to the remote repository
      - name: Push branch
        run: |
          git push origin HEAD

      # Create a pull request from the new branch into new_main
      # Uses GitHub CLI with the workflow token for authentication
      - name: Create PR
        run: |
          gh pr create \
            --base new_main \
            --head cherry-pick-${{ github.run_id }} \
            --title "Cherry-pick" \
            --body "Automated cherry-pick to new_main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}