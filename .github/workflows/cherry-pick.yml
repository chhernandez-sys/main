name: Cherry Pick Hybrid

on:
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to cherry-pick"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'cherry-pick'))
      ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # Determine mode (PR vs manual)
      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=commit" >> $GITHUB_OUTPUT
            echo "value=${{ github.event.inputs.commit }}" >> $GITHUB_OUTPUT
          else
            echo "mode=merge_commit" >> $GITHUB_OUTPUT
            echo "value=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_OUTPUT
          fi

      # Prepare base from new_main
      - name: Create branch from new_main
        run: |
          git fetch origin
          git checkout -B new_main origin/new_main
          git checkout -b cherry-pick-${{ github.run_id }}

      # Cherry-pick (allow conflicts and still create PR)
      - name: Cherry-pick
        run: |
          if [ "${{ steps.vars.outputs.mode }}" = "commit" ]; then
            echo "Cherry-picking single commit"
            git cherry-pick ${{ steps.vars.outputs.value }} || true
          else
            echo "Cherry-picking merge commit"
            git cherry-pick -m 1 ${{ steps.vars.outputs.value }} || true
          fi

          # ALWAYS try to finalize the cherry-pick
          git add .
          git commit --no-edit || true

      - name: Push branch
        run: |
          git push origin HEAD

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: cherry-pick-${{ github.run_id }}
          base: new_main
          title: "Cherry-pick"
          body: "Automated cherry-pick to new_main"