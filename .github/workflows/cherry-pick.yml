name: Cherry Pick Hybrid

on:
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to cherry-pick"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'cherry-pick'))
      ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # Determine mode (PR vs manual)
      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=commit" >> $GITHUB_OUTPUT
            echo "value=${{ github.event.inputs.commit }}" >> $GITHUB_OUTPUT
          else
            echo "mode=branch" >> $GITHUB_OUTPUT
            echo "value=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          fi

      # Prepare base branch from new_main
      - name: Create branch from new_main
        run: |
          git fetch origin
          git checkout -B new_main origin/new_main
          git checkout -b cherry-pick-${{ github.run_id }}

      # Cherry-pick depending on mode
      - name: Cherry-pick
        run: |
          if [ "${{ steps.vars.outputs.mode }}" = "commit" ]; then
            echo "Cherry-picking single commit"
            git cherry-pick ${{ steps.vars.outputs.value }} || exit 1
          else
            echo "Cherry-picking PR commits"

            git fetch origin ${{ steps.vars.outputs.value }}
            git fetch origin main

            git log --reverse --pretty=format:"%H" \
              origin/${{ steps.vars.outputs.value }} ^origin/main > commits.txt

            for commit in $(cat commits.txt); do
              echo "Cherry-picking $commit"
              git cherry-pick $commit || exit 1
            done
          fi

      - name: Push branch
        run: |
          git push origin HEAD

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: cherry-pick-${{ github.run_id }}
          base: new_main
          title: "Cherry-pick"
          body: "Automated cherry-pick to new_main"